<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Geist; font-weight: 400; src: url("{{font400}}") format("woff2"); }
@font-face { font-family: Geist; font-weight: 700; src: url("{{font700}}") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 640px; background: #151A22; color: #FFFFFF; font-family: Geist, sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; }
.wm { display: flex; align-items: center; font-weight: 700; font-size: 150px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
.wm svg { height: .74em; width: .74em; margin-right: .03em; }
.line { margin-top: 36px; font-size: 38px; color: #E3E6EB; }
.apps { display: grid; gap: 32px; }
.app { display: flex; align-items: center; gap: 28px; font-size: 40px; }
.app img { width: 112px; height: 112px; }
.app b { font-weight: 700; }
</style>
</head>
<body>
<div>
  <div class="wm"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="20"/></svg><span>mark</span></div>
  <p class="line">Small plain-file tools you own.</p>
</div>
<div class="apps">
  <div class="app"><img src="{{tasks}}" alt=""><span><b>Omark</b> Tasks</span></div>
  <div class="app"><img src="{{time}}" alt=""><span><b>Omark</b> Time</span></div>
  <div class="app"><img src="{{goals}}" alt=""><span><b>Omark</b> Goals</span></div>
</div>
</body>
</html>
