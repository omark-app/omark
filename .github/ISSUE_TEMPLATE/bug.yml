name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - Windows / Brave
        - Both
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: "1. …"
