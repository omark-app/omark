name: CI
# PRs: check, e2e, and (same-repo PRs, once DEPLOY_ENABLED is set) a preview of the demo build. Merges to main:
# the same checks, then a deploy to staging and to the public demo when DEPLOY_ENABLED is set. A fork has no
# secrets, so only check and e2e run for it. Names, hosts and folders are repository variables (README,
# Environment variables), one set per app: the deploy jobs are named after the app (tasks-preview,
# tasks-staging, tasks-demo) and read TASKS_* ones. CI can also be started by hand (Actions → CI → Run
# workflow) for when GitHub misses a push; on main that deploys staging and the demo too. The Tasks app reaches
# production only through promote.yml; the demo has no Promote step. The site (omark.app) deploys from main via
# site-production, and PRs get a site-preview. Omark Time has time-preview (a fake build) and time-staging, with
# TIME_* variables; it has no production yet. (doc/TaskApp factory spec.md, section 6)
on:
  pull_request:
    paths-ignore: ['doc/**', '**/*.md']
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['doc/**', '**/*.md']
concurrency:
  # PRs: a newer push replaces the older run. main: one group per commit, so no merge's checks are dropped.
  # (Its tasks-staging and tasks-demo jobs still queue in their own `staging` and `demo` groups, where only the
  # newest waiting deploy runs.)
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
      - run: pnpm typecheck
      - run: pnpm test
  stop-on-check-failure:
    # check and e2e start together, so a green run doesn't wait for check. A failed check fails the run anyway,
    # so this stops the e2e jobs early. It is its own job so check shows as failed, not cancelled. A fork's
    # PR token can't cancel, so for forks e2e just runs on.
    needs: [check]
    if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
  e2e:
    # One job per Playwright project, in parallel. Playwright's image has the browsers and their Linux packages,
    # so nothing is installed. Its version must match @playwright/test (workflows.test.ts checks it).
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      # The runner's user, so the browsers don't run as root and the files written belong to the runner.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tasks e2e --project=${{ matrix.project }}
      - run: pnpm --filter site e2e --project=${{ matrix.project }}
      - run: pnpm --filter time e2e --project=${{ matrix.project }}
  tasks-preview:
    # Same-repo PRs only: a fork's PR has no secrets, and its code must never meet ours. It waits for check
    # but not e2e, so AL can look while e2e runs; the PR is ready only once e2e is green too.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.DEPLOY_ENABLED == 'true'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_TASKS_STAGING_PROJECT" ]; then
            echo "::error::Set the repository variable CF_TASKS_STAGING_PROJECT (README, Environment variables)."
            exit 1
          fi
        env:
          CF_TASKS_STAGING_PROJECT: ${{ vars.CF_TASKS_STAGING_PROJECT }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo build: sample tasks kept in this browser, Reset demo in the footer, no sign-in. It still
      # says PREVIEW, from the host.
      - run: pnpm --filter tasks build
        env:
          VITE_STORAGE: demo
          VITE_REAL_USE_URL: ${{ vars.TASKS_REAL_USE_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
          VITE_PREVIEW_HOST_SUFFIXES: ${{ vars.TASKS_PREVIEW_HOST_SUFFIXES }}
      - name: Make sure the staging project exists
        run: node tools/ci/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TASKS_STAGING_PROJECT }}
          PAGES_DOMAIN: ${{ vars.TASKS_STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_TASKS_ZONE_ID }}
      - name: Deploy the preview
        id: preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use the workspace's pinned wrangler; the action can't `pnpm add` it at a workspace root.
          wranglerVersion: '4.151.1'
          command: pages deploy apps/tasks/dist --project-name=${{ vars.CF_TASKS_STAGING_PROJECT }} --branch=pr-${{ github.event.number }}
      - name: Comment the preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.pages-deployment-alias-url || steps.preview.outputs.deployment-url }}
        with:
          script: |
            // Before the monorepo move the marker was taskapp-preview: update that comment too.
            const marker = '<!-- tasks-preview -->';
            const markers = [marker, '<!-- taskapp-preview -->'];
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nDemo build v${context.runNumber} (\`${sha}\`): sample tasks kept in this browser, Reset demo in the footer, no sign-in.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => markers.some((m) => c.body?.startsWith(m)));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
  tasks-staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_TASKS_STAGING_PROJECT" ] || [ -z "$TASKS_STAGING_HOST" ] || [ -z "$TASKS_STAGING_URL" ]; then
            echo "::error::Set the repository variables CF_TASKS_STAGING_PROJECT, TASKS_STAGING_HOST and TASKS_STAGING_URL (README, Environment variables)."
            exit 1
          fi
          if [ "$TASKS_STAGING_URL" != "https://$TASKS_STAGING_HOST" ]; then
            echo "::error::TASKS_STAGING_URL must be https:// followed by TASKS_STAGING_HOST."
            exit 1
          fi
        env:
          CF_TASKS_STAGING_PROJECT: ${{ vars.CF_TASKS_STAGING_PROJECT }}
          TASKS_STAGING_HOST: ${{ vars.TASKS_STAGING_HOST }}
          TASKS_STAGING_URL: ${{ vars.TASKS_STAGING_URL }}
      - name: Skip if main has moved on
        # A run whose e2e finished later must not overwrite a newer commit's deploy; that commit's own run deploys
        # it (#81). Commits that only touch docs get no CI run (paths-ignore above), so they don't count. This runs
        # inside the job's concurrency group, so two deploys never pass it at once.
        id: tip
        run: |
          newer=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" --jq '[(.files // [])[].filename | select(test("^doc/|[.]md$") | not)] | length')
          if [ "$newer" = 0 ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer changes, so its own run deploys. Skipping $GITHUB_SHA."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/checkout@v4
      - if: steps.tip.outputs.latest == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm install --frozen-lockfile
      # One build for staging and production: the app picks its folder and look from the host name.
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm --filter tasks build
        env:
          # The version shown in the footer; Promote ships this same build, so production shows it too.
          # run_number counts per workflow file: renaming ci.yml would restart it at 1.
          BUILD_NUMBER: ${{ github.run_number }}
          VITE_PROD_HOST: ${{ vars.TASKS_PROD_HOST }}
          VITE_STAGING_HOST: ${{ vars.TASKS_STAGING_HOST }}
          VITE_PREVIEW_HOST_SUFFIXES: ${{ vars.TASKS_PREVIEW_HOST_SUFFIXES }}
          VITE_PROD_FOLDER: ${{ vars.TASKS_PROD_FOLDER }}
          VITE_STAGING_FOLDER: ${{ vars.TASKS_STAGING_FOLDER }}
          VITE_ONEDRIVE_SCOPE: ${{ vars.TASKS_ONEDRIVE_SCOPE }}
      - if: steps.tip.outputs.latest == 'true'
        name: Keep the build for Promote
        uses: actions/upload-artifact@v4
        with:
          name: tasks-dist
          path: apps/tasks/dist
          retention-days: 30
      - if: steps.tip.outputs.latest == 'true'
        name: Make sure the staging project exists
        run: node tools/ci/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TASKS_STAGING_PROJECT }}
          PAGES_DOMAIN: ${{ vars.TASKS_STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_TASKS_ZONE_ID }}
      - if: steps.tip.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Run from the repo root, so wrangler also bundles functions/ (the sign-in helper at /api/auth/*).
          command: pages deploy apps/tasks/dist --project-name=${{ vars.CF_TASKS_STAGING_PROJECT }} --branch=main
      - if: steps.tip.outputs.latest == 'true'
        name: Check the sign-in helper is live
        # /api/auth/login must redirect to Microsoft for MSAL_TENANT, asking for the scope the build expects.
        # That holds only when the functions shipped and the Pages secrets (README, Sign-in) are set.
        run: node tools/ci/check-signin.mjs
        env:
          SIGNIN_URL: ${{ vars.TASKS_STAGING_URL }}
          MSAL_TENANT: ${{ vars.TASKS_MSAL_TENANT }}
          ONEDRIVE_SCOPE: ${{ vars.TASKS_ONEDRIVE_SCOPE }}
  tasks-demo:
    # The public demo (README, Deploy): its own Pages project and build, deployed from main with staging.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: demo
      cancel-in-progress: false
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_TASKS_DEMO_PROJECT" ] || [ -z "$TASKS_DEMO_URL" ]; then
            echo "::error::Set the repository variables CF_TASKS_DEMO_PROJECT and TASKS_DEMO_URL (README, Environment variables)."
            exit 1
          fi
        env:
          CF_TASKS_DEMO_PROJECT: ${{ vars.CF_TASKS_DEMO_PROJECT }}
          TASKS_DEMO_URL: ${{ vars.TASKS_DEMO_URL }}
      - name: Skip if main has moved on
        # A run whose e2e finished later must not overwrite a newer commit's deploy; that commit's own run deploys
        # it (#81). Commits that only touch docs get no CI run (paths-ignore above), so they don't count. This runs
        # inside the job's concurrency group, so two deploys never pass it at once.
        id: tip
        run: |
          newer=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" --jq '[(.files // [])[].filename | select(test("^doc/|[.]md$") | not)] | length')
          if [ "$newer" = 0 ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer changes, so its own run deploys. Skipping $GITHUB_SHA."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/checkout@v4
      - if: steps.tip.outputs.latest == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm --filter tasks build
        env:
          VITE_STORAGE: demo
          VITE_REAL_USE_URL: ${{ vars.TASKS_REAL_USE_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
      # The project only: its custom domain and DNS record were set up once by hand, so the CI token needs no
      # permission on that zone. The live check below catches a broken domain.
      - if: steps.tip.outputs.latest == 'true'
        name: Make sure the demo project exists
        run: node tools/ci/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TASKS_DEMO_PROJECT }}
      # Run from apps/tasks, not the repo root, so wrangler leaves out functions/: the demo has no sign-in
      # helper and no /api/auth at all. It is the workspace's wrangler (root package.json, the version the
      # deploy actions pin).
      - if: steps.tip.outputs.latest == 'true'
        name: Deploy the demo
        working-directory: apps/tasks
        run: ../../node_modules/.bin/wrangler pages deploy dist --project-name="$CF_TASKS_DEMO_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TASKS_DEMO_PROJECT: ${{ vars.CF_TASKS_DEMO_PROJECT }}
      - if: steps.tip.outputs.latest == 'true'
        name: Check the demo is live, without the sign-in helper
        run: node tools/ci/check-demo.mjs
        env:
          DEMO_URL: ${{ vars.TASKS_DEMO_URL }}
  time-preview:
    # As tasks-preview: same-repo PRs only, once check passes. The fake build (fake calendar and drive kept in
    # this browser, stubbed sign-in) goes to pr-<n> of the Time staging project.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.DEPLOY_ENABLED == 'true'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_TIME_STAGING_PROJECT" ]; then
            echo "::error::Set the repository variable CF_TIME_STAGING_PROJECT (README, Environment variables)."
            exit 1
          fi
        env:
          CF_TIME_STAGING_PROJECT: ${{ vars.CF_TIME_STAGING_PROJECT }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter time build
        env:
          VITE_STORAGE: fake
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Make sure the staging project exists
        run: node tools/ci/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TIME_STAGING_PROJECT }}
          PAGES_DOMAIN: ${{ vars.TIME_STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_TIME_ZONE_ID }}
      - name: Deploy the preview
        id: preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: pages deploy apps/time/dist --project-name=${{ vars.CF_TIME_STAGING_PROJECT }} --branch=pr-${{ github.event.number }}
      - name: Comment the preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.pages-deployment-alias-url || steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- time-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Omark Time preview:** ${process.env.PREVIEW_URL}\n\nFake build v${context.runNumber} (\`${sha}\`): a fake calendar and drive kept in this browser, no real sign-in.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
  time-staging:
    # As tasks-staging, for Omark Time at TIME_STAGING_HOST. There is no Promote for Time yet (T.9).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: time-staging
      cancel-in-progress: false
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_TIME_STAGING_PROJECT" ] || [ -z "$TIME_STAGING_HOST" ] || [ -z "$TIME_STAGING_URL" ]; then
            echo "::error::Set the repository variables CF_TIME_STAGING_PROJECT, TIME_STAGING_HOST and TIME_STAGING_URL (README, Environment variables)."
            exit 1
          fi
          if [ "$TIME_STAGING_URL" != "https://$TIME_STAGING_HOST" ]; then
            echo "::error::TIME_STAGING_URL must be https:// followed by TIME_STAGING_HOST."
            exit 1
          fi
        env:
          CF_TIME_STAGING_PROJECT: ${{ vars.CF_TIME_STAGING_PROJECT }}
          TIME_STAGING_HOST: ${{ vars.TIME_STAGING_HOST }}
          TIME_STAGING_URL: ${{ vars.TIME_STAGING_URL }}
      - name: Skip if main has moved on
        # As in tasks-staging (#81): only main's tip deploys; newer commits that touch only docs don't count.
        id: tip
        run: |
          newer=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" --jq '[(.files // [])[].filename | select(test("^doc/|[.]md$") | not)] | length')
          if [ "$newer" = 0 ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer changes, so its own run deploys. Skipping $GITHUB_SHA."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/checkout@v4
      - if: steps.tip.outputs.latest == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm --filter time build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - if: steps.tip.outputs.latest == 'true'
        name: Make sure the staging project exists
        run: node tools/ci/ensure-pages-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TIME_STAGING_PROJECT }}
          PAGES_DOMAIN: ${{ vars.TIME_STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_TIME_ZONE_ID }}
      - if: steps.tip.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Run from the repo root, so wrangler also bundles functions/ (the sign-in helper at /api/auth/*).
          command: pages deploy apps/time/dist --project-name=${{ vars.CF_TIME_STAGING_PROJECT }} --branch=main
      - if: steps.tip.outputs.latest == 'true'
        name: Check the sign-in helper is live
        # /api/auth/login?provider=google must ask Google to read calendars and events, and for no more.
        run: node tools/ci/check-google-signin.mjs
        env:
          SIGNIN_URL: ${{ vars.TIME_STAGING_URL }}
  site-preview:
    # The omark.app landing site (apps/site). Same-repo PRs only, like tasks-preview, and only when the PR touches
    # the site or what it shares (the design tokens, the lockfile): other PRs skip every step after the check.
    # Like tasks-preview, it waits for check but not e2e.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.DEPLOY_ENABLED == 'true'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_SITE_PROJECT" ]; then
            echo "::error::Set the repository variable CF_SITE_PROJECT (README, Environment variables)."
            exit 1
          fi
        env:
          CF_SITE_PROJECT: ${{ vars.CF_SITE_PROJECT }}
      - uses: actions/checkout@v4
        with:
          # The whole history, so the diff against the PR's base branch can be taken.
          fetch-depth: 0
      - name: Look for site changes
        id: changed
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- apps/site apps/tasks/src/styles/tokens.css pnpm-lock.yaml; then
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "No site changes: nothing to preview."
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: steps.changed.outputs.site == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.changed.outputs.site == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.site == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.site == 'true'
        run: pnpm --filter site build
      - name: Deploy the preview
        id: preview
        if: steps.changed.outputs.site == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use the workspace's pinned wrangler; the action can't `pnpm add` it at a workspace root.
          wranglerVersion: '4.151.1'
          # Deploy from apps/site: wrangler bundles ./functions next to where it runs, so only the site's own
          # functions/_middleware.ts ships, never the sign-in helper in the root functions/api/auth.
          workingDirectory: apps/site
          command: pages deploy dist --project-name=${{ vars.CF_SITE_PROJECT }} --branch=pr-${{ github.event.number }}
      - name: Comment the preview link
        if: steps.changed.outputs.site == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.pages-deployment-alias-url || steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            const base = process.env.PREVIEW_URL.replace(/\/+$/, '');
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Site preview:** ${base}/\n\n[Privacy policy](${base}/privacy/) · [Terms](${base}/terms/) (\`${sha}\`)`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
  site-production:
    # The site has no staging and no Promote: a merge to main is the release. To roll back, see apps/site/README.md.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: site
      cancel-in-progress: false
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_SITE_PROJECT" ] || [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variables CF_SITE_PROJECT and SITE_URL (README, Environment variables)."
            exit 1
          fi
        env:
          CF_SITE_PROJECT: ${{ vars.CF_SITE_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Skip if main has moved on
        # A run whose e2e finished later must not overwrite a newer commit's deploy; that commit's own run deploys
        # it (#81). Commits that only touch docs get no CI run (paths-ignore above), so they don't count. This runs
        # inside the job's concurrency group, so two deploys never pass it at once.
        id: tip
        run: |
          newer=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main" --jq '[(.files // [])[].filename | select(test("^doc/|[.]md$") | not)] | length')
          if [ "$newer" = 0 ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has newer changes, so its own run deploys. Skipping $GITHUB_SHA."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/checkout@v4
      - if: steps.tip.outputs.latest == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.tip.outputs.latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tip.outputs.latest == 'true'
        run: pnpm --filter site build
      - if: steps.tip.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # From apps/site, so only its own functions ship, not the sign-in helper in the root functions/.
          workingDirectory: apps/site
          command: pages deploy dist --project-name=${{ vars.CF_SITE_PROJECT }} --branch=main
      - if: steps.tip.outputs.latest == 'true'
        name: Check the site is live
        # The privacy policy must carry Google's Limited Use text, and the site must send its CSP header. The custom
        # domain can take a moment to serve the new deploy, so try a few times.
        run: |
          for try in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$SITE_URL/privacy/" | grep -q "Limited Use" \
              && curl -sSI --max-time 20 "$SITE_URL/" | grep -qi '^content-security-policy:'; then
              echo "The site is live."
              exit 0
            fi
            echo "Not live yet (try $try of 5)."
            sleep 10
          done
          echo "::error::$SITE_URL/privacy/ is missing the policy text or the content-security-policy header after the deploy."
          exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}
