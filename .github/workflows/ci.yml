name: CI
# PRs: check, e2e, and (same-repo PRs, once DEPLOY_ENABLED is set) a preview of the fake build. Merges to main:
# the same checks, then a deploy to staging when DEPLOY_ENABLED is set. A fork has no secrets, so only check
# and e2e run for it. Names, hosts and folders are repository variables (README, Environment variables).
# CI can also be started by hand (Actions → CI → Run workflow) for when GitHub misses a push; on main that
# deploys staging too. Production only changes through promote.yml. (doc/TaskApp factory spec.md, section 6)
on:
  pull_request:
    paths-ignore: ['doc/**', '**/*.md']
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['doc/**', '**/*.md']
concurrency:
  # PRs: a newer push replaces the older run. main: one group per commit, so no merge's checks are dropped.
  # (Its deploy-staging job still queues in the `staging` group, where only the newest waiting deploy runs.)
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
      - run: pnpm typecheck
      - run: pnpm test
  stop-on-check-failure:
    # check and e2e start together, so a green run doesn't wait for check. A failed check fails the run anyway,
    # so this stops the e2e jobs early. It is its own job so check shows as failed, not cancelled. A fork's
    # PR token can't cancel, so for forks e2e just runs on.
    needs: [check]
    if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
  e2e:
    # One job per Playwright project, in parallel. Playwright's image has the browsers and their Linux packages,
    # so nothing is installed. Its version must match @playwright/test (workflows.test.ts checks it).
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      # The runner's user, so the browsers don't run as root and the files written belong to the runner.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, iphone]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web e2e --project=${{ matrix.project }}
  preview:
    # Same-repo PRs only: a fork's PR has no secrets, and its code must never meet ours.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fake build e2e tested, built again here so e2e needs nothing from the repository's settings.
      - run: pnpm --filter web build
        env:
          VITE_STORAGE: fake
          BUILD_NUMBER: ${{ github.run_number }}
          VITE_PREVIEW_HOST_SUFFIXES: ${{ vars.PREVIEW_HOST_SUFFIXES }}
      - name: Make sure the staging project exists
        run: node tools/ci/ensure-staging.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_STAGING_PROJECT: ${{ vars.CF_STAGING_PROJECT }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      - name: Deploy the preview
        id: preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use the workspace's pinned wrangler; the action can't `pnpm add` it at a workspace root.
          wranglerVersion: '4.151.1'
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_STAGING_PROJECT }} --branch=pr-${{ github.event.number }}
      - name: Comment the preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.pages-deployment-alias-url || steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- taskapp-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nFake drive with sample tasks, build v${context.runNumber} (\`${sha}\`). Sign-in is stubbed.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
  deploy-staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_STAGING_PROJECT" ] || [ -z "$STAGING_HOST" ] || [ -z "$STAGING_URL" ]; then
            echo "::error::Set the repository variables CF_STAGING_PROJECT, STAGING_HOST and STAGING_URL (README, Environment variables)."
            exit 1
          fi
          if [ "$STAGING_URL" != "https://$STAGING_HOST" ]; then
            echo "::error::STAGING_URL must be https:// followed by STAGING_HOST."
            exit 1
          fi
        env:
          CF_STAGING_PROJECT: ${{ vars.CF_STAGING_PROJECT }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_URL: ${{ vars.STAGING_URL }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One build for staging and production: the app picks its folder and look from the host name.
      - run: pnpm --filter web build
        env:
          # The version shown in the footer; Promote ships this same build, so production shows it too.
          # run_number counts per workflow file: renaming ci.yml would restart it at 1.
          BUILD_NUMBER: ${{ github.run_number }}
          VITE_PROD_HOST: ${{ vars.PROD_HOST }}
          VITE_STAGING_HOST: ${{ vars.STAGING_HOST }}
          VITE_PREVIEW_HOST_SUFFIXES: ${{ vars.PREVIEW_HOST_SUFFIXES }}
          VITE_PROD_FOLDER: ${{ vars.PROD_FOLDER }}
          VITE_STAGING_FOLDER: ${{ vars.STAGING_FOLDER }}
          VITE_ONEDRIVE_SCOPE: ${{ vars.ONEDRIVE_SCOPE }}
      - name: Keep the build for Promote
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 30
      - name: Make sure the staging project exists
        run: node tools/ci/ensure-staging.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_STAGING_PROJECT: ${{ vars.CF_STAGING_PROJECT }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # Run from the repo root, so wrangler also bundles functions/ (the sign-in helper at /api/auth/*).
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_STAGING_PROJECT }} --branch=main
      - name: Check the sign-in helper is live
        # /api/auth/login must redirect to Microsoft for MSAL_TENANT, asking for the scope the build expects.
        # That holds only when the functions shipped and the Pages secrets (README, Sign-in) are set.
        run: node tools/ci/check-signin.mjs
        env:
          SIGNIN_URL: ${{ vars.STAGING_URL }}
          MSAL_TENANT: ${{ vars.MSAL_TENANT }}
          ONEDRIVE_SCOPE: ${{ vars.ONEDRIVE_SCOPE }}
