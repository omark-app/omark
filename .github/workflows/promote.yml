name: Promote to production
# By hand only (GitHub app: Actions → Promote to production → Run workflow). Deploys the exact build staging
# ran for a commit on main whose CI passed, then tags it <app>-prod-YYYY-MM-DD-n (omark-prod-…) with release
# notes. `omark` is the one app (app.omark.app). Rollback: run it with an older omark-prod- tag.
# The app's folder, package and build name come from the promoted commit (promote-check.mjs), so an older one
# still deploys. (doc/self-hosting.md, Deploy: Promote, tags and rollback)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'omark: the one app.'
        type: choice
        options: [omark]
        default: omark
        required: true
      commit:
        description: 'Commit SHA or <app>-prod- tag. Empty: what staging runs now.'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  promote:
    # Only the promote.yml on main may run: from another branch the file (and its checks) could be edited.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the repository variables
        # Also gives a rebuild the app's hosts and folders (the VITE_* build variables, through $GITHUB_ENV).
        run: |
          if [ -z "$CF_APP_PROJECT" ] || [ -z "$APP_PROD_HOST" ] || [ -z "$APP_PROD_URL" ]; then
            echo "::error::Set the repository variables CF_APP_PROJECT, APP_PROD_HOST and APP_PROD_URL (doc/self-hosting.md, GitHub Actions)."
            exit 1
          fi
          if [ "$APP_PROD_URL" != "https://$APP_PROD_HOST" ]; then
            echo "::error::APP_PROD_URL must be https:// followed by APP_PROD_HOST."
            exit 1
          fi
          {
            echo "VITE_PROD_HOST=$APP_PROD_HOST"
            echo "VITE_STAGING_HOST=$APP_STAGING_HOST"
            echo "VITE_PREVIEW_HOST_SUFFIXES=$APP_PREVIEW_HOST_SUFFIXES"
          } >> "$GITHUB_ENV"
        env:
          CF_APP_PROJECT: ${{ vars.CF_APP_PROJECT }}
          APP_PROD_HOST: ${{ vars.APP_PROD_HOST }}
          APP_PROD_URL: ${{ vars.APP_PROD_URL }}
          APP_STAGING_HOST: ${{ vars.APP_STAGING_HOST }}
          APP_PREVIEW_HOST_SUFFIXES: ${{ vars.APP_PREVIEW_HOST_SUFFIXES }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The scripts come from main, so an older commit (a rollback) is checked the same way.
      - name: Keep the promote scripts
        run: cp -r tools/ci "$RUNNER_TEMP/ci"
      - name: Check the commit
        id: check
        run: node "$RUNNER_TEMP/ci/promote-check.mjs" "$COMMIT" "$APP"
        env:
          COMMIT: ${{ inputs.commit }}
          APP: ${{ inputs.app }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out the commit
        run: git checkout --detach "$SHA"
        env:
          SHA: ${{ steps.check.outputs.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the build staging ran
        if: steps.check.outputs.artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.check.outputs.artifact_name }}
          path: ${{ steps.check.outputs.app_dir }}/dist
          run-id: ${{ steps.check.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild (the stored build has expired)
        if: steps.check.outputs.artifact != 'true'
        # The hosts and folders come from the first step.
        run: pnpm --filter ${{ steps.check.outputs.filter }} build
        env:
          BUILD_SHA: ${{ steps.check.outputs.sha }}
          # The version label of the build staging ran: its run number and date.
          BUILD_NUMBER: ${{ steps.check.outputs.run_number }}
          BUILD_TIME: ${{ steps.check.outputs.built_at }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          # From the app's folder, so wrangler bundles its functions/ (the one app's sign-in helper at /api/auth/*).
          workingDirectory: ${{ steps.check.outputs.app_dir }}
          command: pages deploy dist --project-name=${{ vars.CF_APP_PROJECT }} --branch=main --commit-hash=${{ steps.check.outputs.sha }}
      - name: Check the sign-in helper is live
        # Microsoft with the app folder, Google with Drive's own files, the calendar alone with read access.
        run: node "$RUNNER_TEMP/ci/check-omark-signin.mjs"
        env:
          SIGNIN_URL: ${{ vars.APP_PROD_URL }}
          MSAL_TENANT: ${{ vars.APP_MSAL_TENANT }}
      - name: Release notes
        id: notes
        run: node "$RUNNER_TEMP/ci/release-notes.mjs" "$SHA" "$APP"
        env:
          SHA: ${{ steps.check.outputs.sha }}
          APP: ${{ inputs.app }}
      - name: Tag and release
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          SHA: ${{ steps.check.outputs.sha }}
