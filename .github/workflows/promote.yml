name: Promote to production
# By hand only (GitHub app: Actions → Promote to production → Run workflow). Deploys the exact build staging
# ran for a commit on main whose CI passed, then tags it prod-YYYY-MM-DD-n with release notes. Rollback:
# run it with an older prod- tag. (doc/TaskApp factory spec.md, 6.2)
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA or prod- tag. Empty: what staging runs now.'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  promote:
    # Only the promote.yml on main may run: from another branch the file (and its checks) could be edited.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "$CF_PROD_PROJECT" ] || [ -z "$PROD_HOST" ] || [ -z "$PROD_URL" ]; then
            echo "::error::Set the repository variables CF_PROD_PROJECT, PROD_HOST and PROD_URL (README, Environment variables)."
            exit 1
          fi
          if [ "$PROD_URL" != "https://$PROD_HOST" ]; then
            echo "::error::PROD_URL must be https:// followed by PROD_HOST."
            exit 1
          fi
        env:
          CF_PROD_PROJECT: ${{ vars.CF_PROD_PROJECT }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_URL: ${{ vars.PROD_URL }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The scripts come from main, so an older commit (a rollback) is checked the same way.
      - name: Keep the promote scripts
        run: cp -r tools/ci "$RUNNER_TEMP/ci"
      - name: Check the commit
        id: check
        run: node "$RUNNER_TEMP/ci/promote-check.mjs" "$COMMIT"
        env:
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out the commit
        run: git checkout --detach "$SHA"
        env:
          SHA: ${{ steps.check.outputs.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the build staging ran
        if: steps.check.outputs.artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          run-id: ${{ steps.check.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild (the stored build has expired)
        if: steps.check.outputs.artifact != 'true'
        run: pnpm --filter web build
        env:
          BUILD_SHA: ${{ steps.check.outputs.sha }}
          VITE_PROD_HOST: ${{ vars.PROD_HOST }}
          VITE_STAGING_HOST: ${{ vars.STAGING_HOST }}
          VITE_PREVIEW_HOST_SUFFIXES: ${{ vars.PREVIEW_HOST_SUFFIXES }}
          VITE_PROD_FOLDER: ${{ vars.PROD_FOLDER }}
          VITE_STAGING_FOLDER: ${{ vars.STAGING_FOLDER }}
          VITE_ONEDRIVE_SCOPE: ${{ vars.ONEDRIVE_SCOPE }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use the workspace's pinned wrangler; the action can't `pnpm add` it at a workspace root.
          wranglerVersion: '4.151.1'
          # Run from the repo root, so wrangler also bundles functions/ (the sign-in helper at /api/auth/*).
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_PROD_PROJECT }} --branch=main --commit-hash=${{ steps.check.outputs.sha }}
      - name: Check the sign-in helper is live
        # /api/auth/login must redirect to Microsoft for MSAL_TENANT, asking for the scope the build expects.
        # That holds only when the functions shipped and the Pages secrets (README, Sign-in) are set.
        run: node "$RUNNER_TEMP/ci/check-signin.mjs"
        env:
          SIGNIN_URL: ${{ vars.PROD_URL }}
          MSAL_TENANT: ${{ vars.MSAL_TENANT }}
          ONEDRIVE_SCOPE: ${{ vars.ONEDRIVE_SCOPE }}
      - name: Release notes
        id: notes
        run: node "$RUNNER_TEMP/ci/release-notes.mjs" "$SHA"
        env:
          SHA: ${{ steps.check.outputs.sha }}
      - name: Tag and release
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          SHA: ${{ steps.check.outputs.sha }}
